name: Release

on:
  release:
    types: [published]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  release:
    name: Build and release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build all platforms
        run: |
          for GOOS in linux darwin; do
            for GOARCH in amd64 arm64; do
              CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath \
                -o gh-$GOOS-$GOARCH ./cmd
            done
          done
      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} \
            gh-linux-amd64 gh-linux-arm64 \
            gh-darwin-amd64 gh-darwin-arm64 \
            prunesh.json

  publish:
    name: Publish to marketplace
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Get OIDC token
        id: oidc
        run: |
          TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=prunesh-marketplace" \
            | jq -r .value)
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
      - name: Publish to marketplace
        run: |
          curl -sf -X POST \
            https://prunesh-marketplace-worker.prunesh-marketplace-worker.workers.dev/publish \
            -H "Content-Type: application/json" \
            -d '{
              "oidc_token": "${{ steps.oidc.outputs.token }}",
              "plugin_id": "prunesh/gh",
              "version": "${{ github.ref_name }}",
              "repo": "https://github.com/${{ github.repository }}"
            }'
